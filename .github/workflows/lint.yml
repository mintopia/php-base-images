name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [alpine, trixie, php-src]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}.Dockerfile

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: find rootfs build tests scripts -name '*.sh' -print0 | xargs -0 shellcheck

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  tags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/tags_test.sh
      - run: scripts/product-plan_test.sh

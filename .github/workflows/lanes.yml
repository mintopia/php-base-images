name: lanes

# one PHP version's build products, builds and merges; build.yml calls this once per versions.json key
on:
  workflow_call:
    inputs:
      lanes:
        type: string
        required: true
      merges:
        type: string
        required: true
      products:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  # keeps every lane's build products in the Actions cache (ADR 0023); only main saves, so pull requests read main's
  products:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.products != '[]' }}
    name: products ${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(inputs.products) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Bake variables
        env:
          VARS: ${{ toJSON(matrix.vars) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$VARS" >> "$GITHUB_ENV"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/product-keys.sh | tee keys >> "$GITHUB_OUTPUT"
          scripts/product-plan.sh < keys | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' php ')
        with:
          path: products/php
          key: ${{ steps.plan.outputs.php }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' frankenphp ')
        with:
          path: products/frankenphp
          key: ${{ steps.plan.outputs.frankenphp }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-grpc ')
        with:
          path: products/ext-grpc
          key: ${{ steps.plan.outputs.ext-grpc }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-redis ')
        with:
          path: products/ext-redis
          key: ${{ steps.plan.outputs.ext-redis }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-apcu ')
        with:
          path: products/ext-apcu
          key: ${{ steps.plan.outputs.ext-apcu }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-mongodb ')
        with:
          path: products/ext-mongodb
          key: ${{ steps.plan.outputs.ext-mongodb }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-opentelemetry ')
        with:
          path: products/ext-opentelemetry
          key: ${{ steps.plan.outputs.ext-opentelemetry }}
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' ext-protobuf ')
        with:
          path: products/ext-protobuf
          key: ${{ steps.plan.outputs.ext-protobuf }}
      - name: Build
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          read -ra build <<<"$BUILD"
          [ ${#build[@]} -gt 0 ] || exit 0
          PRODUCTS=$(find products -mindepth 1 -maxdepth 1 -printf '%f ' 2>/dev/null || true)
          export PRODUCTS
          jq -n '{target: ($ARGS.positional | map({key: "product-\(.)", value: {output: ["type=local,dest=products/\(.)"]}}) | from_entries)}' \
            --args "${build[@]}" > outputs.json
          docker buildx bake -f docker-bake.hcl -f versions.json -f outputs.json "${build[@]/#/product-}"
          du -sh "${build[@]/#/products/}"
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' php ')
        with:
          path: products/php
          key: ${{ steps.plan.outputs.php }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' frankenphp ')
        with:
          path: products/frankenphp
          key: ${{ steps.plan.outputs.frankenphp }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-grpc ')
        with:
          path: products/ext-grpc
          key: ${{ steps.plan.outputs.ext-grpc }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-redis ')
        with:
          path: products/ext-redis
          key: ${{ steps.plan.outputs.ext-redis }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-apcu ')
        with:
          path: products/ext-apcu
          key: ${{ steps.plan.outputs.ext-apcu }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-mongodb ')
        with:
          path: products/ext-mongodb
          key: ${{ steps.plan.outputs.ext-mongodb }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-opentelemetry ')
        with:
          path: products/ext-opentelemetry
          key: ${{ steps.plan.outputs.ext-opentelemetry }}
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' ext-protobuf ')
        with:
          path: products/ext-protobuf
          key: ${{ steps.plan.outputs.ext-protobuf }}

  build:
    needs: products
    if: ${{ !cancelled() && inputs.lanes != '[]' }}
    name: build ${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(inputs.lanes) }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      TARGETS: ${{ matrix.targets }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake variables
        env:
          VARS: ${{ toJSON(matrix.vars) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$VARS" >> "$GITHUB_ENV"
      - id: keys
        run: scripts/product-keys.sh | tee -a "$GITHUB_OUTPUT"
      # a product missing from the cache is built inline
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.php != ''
        with:
          path: products/php
          key: ${{ steps.keys.outputs.php }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.frankenphp != ''
        with:
          path: products/frankenphp
          key: ${{ steps.keys.outputs.frankenphp }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-grpc != ''
        with:
          path: products/ext-grpc
          key: ${{ steps.keys.outputs.ext-grpc }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-redis != ''
        with:
          path: products/ext-redis
          key: ${{ steps.keys.outputs.ext-redis }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-apcu != ''
        with:
          path: products/ext-apcu
          key: ${{ steps.keys.outputs.ext-apcu }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-mongodb != ''
        with:
          path: products/ext-mongodb
          key: ${{ steps.keys.outputs.ext-mongodb }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-opentelemetry != ''
        with:
          path: products/ext-opentelemetry
          key: ${{ steps.keys.outputs.ext-opentelemetry }}
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.ext-protobuf != ''
        with:
          path: products/ext-protobuf
          key: ${{ steps.keys.outputs.ext-protobuf }}
      - name: Restored products
        run: echo "PRODUCTS=$(find products -mindepth 1 -maxdepth 1 -printf '%f ' 2>/dev/null || true)" | tee -a "$GITHUB_ENV"
      # loaded without attestations: the docker exporter can't load an index
      - name: Build
        run: |
          read -ra targets <<<"$TARGETS"
          jq -n --arg prefix "php:$PHP_VERSION-$OS-" \
            '{target: ($ARGS.positional | map({key: ., value: {tags: [], output: ["type=docker,name=\($prefix)\(.)"]}}) | from_entries)}' \
            --args "${targets[@]}" > outputs.json
          docker buildx bake -f docker-bake.hcl -f versions.json -f outputs.json "${targets[@]}"
      - name: Smoke test
        run: |
          for t in $TARGETS; do
            tests/smoke.sh "php:$PHP_VERSION-$OS-$t" "$t"
          done
      - name: Record PHP version
        run: |
          mkdir -p digests
          : > digests/php-version
          for t in $TARGETS; do
            [ "$t" = nginx ] || { docker run --rm --entrypoint php "php:$PHP_VERSION-$OS-$t" -r 'echo PHP_VERSION;' > digests/php-version; break; }
          done
          cat digests/php-version
          for t in $TARGETS; do
            [ "$t" = nginx ] || docker run --rm --entrypoint php "php:$PHP_VERSION-$OS-$t" -m > "digests/modules-$t"
          done
      # same builder, so every layer is cached; only attestations and the push are new
      # untagged per-arch indexes go straight into php/nginx; merge deletes them once it has made the multi-arch index
      - name: Push by digest
        if: env.PUBLISH == 'true'
        run: |
          read -ra targets <<<"$TARGETS"
          jq -n '{target: ($ARGS.positional | map({key: ., value: {tags: [],
              output: ["type=image,name=ghcr.io/mintopia/\(if . == "nginx" then "nginx" else "php" end),push-by-digest=true,name-canonical=true,push=true"]}}) | from_entries)}' \
            --args "${targets[@]}" > outputs.json
          docker buildx bake -f docker-bake.hcl -f versions.json -f outputs.json \
            --provenance=mode=max --sbom=true --metadata-file meta.json "${targets[@]}"
      - name: Record digests
        if: env.PUBLISH == 'true'
        run: |
          for t in $TARGETS; do
            image=ghcr.io/mintopia/php
            [ "$t" != nginx ] || image=ghcr.io/mintopia/nginx
            d=$(jq -re --arg t "$t" '.[$t]["containerimage.digest"]' meta.json)
            docker buildx imagetools inspect "$image@$d" > /dev/null
            echo "$d" > "digests/$t"
          done
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && inputs.merges != '[]' }}
    name: merge ${{ matrix.version }}-${{ matrix.os }}-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # GHCR allows 2000 requests a minute across every PHP version's merges
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(inputs.merges) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.version }}-${{ matrix.os }}-*
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        env:
          VERSION: ${{ matrix.version }}
          OS: ${{ matrix.os }}
          VARIANT: ${{ matrix.variant }}
          STABLE: ${{ matrix.stable }}
          LATEST: ${{ matrix.latest }}
          PATCH: ${{ matrix.patch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/mintopia/php
          [ "$VARIANT" != nginx ] || image=ghcr.io/mintopia/nginx
          refs=()
          php=""
          for arch in amd64 arm64; do
            dir="digests/digests-$VERSION-$OS-$arch"
            refs+=("$image@$(cat "$dir/$VARIANT")")
            v=$(cat "$dir/php-version")
            [ -z "$php" ] || [ "$php" = "$v" ] || { echo "::error::PHP $php on one arch, $v on another"; exit 1; }
            php=$v
          done
          tags=()
          names=()
          # an older patch keeps only its own X.Y.Z tags
          filter=.
          if [ "$PATCH" = true ]; then
            [ "$php" = "$VERSION" ] || { echo "::error::lane $VERSION built PHP $php"; exit 1; }
            filter="^${php//./\\.}(-|\$)"
          fi
          while read -r t; do tags+=(-t "$image:$t"); names+=("$t"); done < <(scripts/tags.sh "$php" "$STABLE" "$OS" "$VARIANT" "$LATEST" | grep -E "$filter")
          for i in 1 2 3; do
            docker buildx imagetools create "${tags[@]}" "${refs[@]}" && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 30))
          done
          digest=$(docker buildx imagetools inspect "${tags[1]}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$image@$digest"
          package=$(gh api "/users/$GITHUB_REPOSITORY_OWNER/packages/container/${image##*/}/versions?per_page=100" \
            -q ".[] | select(.name == \"$digest\") | .id" || true)
          platforms=$(docker buildx imagetools inspect "$image@$digest" --raw \
            | jq -c '[.manifests[] | select(.platform.os == "linux") | {key: .platform.architecture, value: .digest}] | from_entries')
          modules=$(cat "digests/digests-$VERSION-$OS-amd64/modules-$VARIANT" 2>/dev/null \
            | jq -R -s -c 'split("\n") | map(select(length > 0 and (startswith("[") | not))) | unique')
          sizes=$(scripts/image-sizes.sh "$image@$digest")
          mkdir -p record
          docker buildx imagetools inspect "$image@$digest" --format '{{json .Image}}' \
            | jq -c --arg time "$(date -u +%FT%TZ)" --arg run "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" \
              --arg image "$image" --arg version "$VERSION" --arg os "$OS" --arg variant "$VARIANT" \
              --arg php "$([ "$VARIANT" = nginx ] || echo "$php")" --argjson stable "$STABLE" --arg digest "$digest" --arg package "$package" --argjson platforms "$platforms" --argjson modules "$modules" --argjson sizes "$sizes" \
              '{time: $time, run: $run, commit: $commit, image: $image, version: $version, os: $os, variant: $variant,
                php: $php, stable: $stable, digest: $digest, package: $package, platforms: $platforms, tags: $ARGS.positional, modules: $modules, sizes: $sizes,
                labels: (.["linux/amd64"].config.Labels // {})}' --args "${names[@]}" \
            > "record/$VERSION-$OS-$VARIANT.json"
      - uses: actions/upload-artifact@v7
        with:
          name: record-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.variant }}
          path: record/
          if-no-files-found: error
          retention-days: 1
      # shortcut: deleted only here, so a failed or abandoned run leaves its per-arch indexes untagged in php/nginx
      # only the per-arch index: its platform image and attestations are now children of the multi-arch index
      - name: Delete per-arch indexes
        env:
          VERSION: ${{ matrix.version }}
          OS: ${{ matrix.os }}
          VARIANT: ${{ matrix.variant }}
          GH_TOKEN: ${{ github.token }}
        run: |
          package=php
          [ "$VARIANT" != nginx ] || package=nginx
          versions=/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package/versions
          # versions are listed newest first; this run's pushes are no older than its start
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at) \
            || started=$(date -u -d '-6 hours' +%FT%TZ)
          for arch in amd64 arm64; do
            digest=$(cat "digests/digests-$VERSION-$OS-$arch/$VARIANT")
            match() { jq -r --arg d "$digest" '.[] | select(.name == $d and (.metadata.container.tags | length) == 0) | .id' <<<"$1"; }
            id='' list=''
            # a new push takes a moment to be listed, so page 1 is retried
            for _ in 1 2 3; do
              list=$(gh api "$versions?per_page=100&page=1") || { list=''; break; }
              id=$(match "$list")
              [ -z "$id" ] || break
              sleep 5
            done
            page=1
            while [ -z "$id" ] && [ -n "$list" ] \
              && jq -e --arg s "$started" 'length == 100 and .[-1].created_at >= $s' <<<"$list" > /dev/null; do
              page=$((page + 1))
              list=$(gh api "$versions?per_page=100&page=$page") || list=''
              id=$(match "$list")
            done
            if [ -z "$id" ]; then
              echo "::warning::$package@$digest not found, left in place"
            else
              gh api -X DELETE "$versions/$id" > /dev/null || echo "::warning::could not delete $package@$digest ($id)"
            fi
          done

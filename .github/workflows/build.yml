name: build

on:
  # every push runs here, not in site.yml, so the site deploys after any builds
  push:
    branches: [main]
  pull_request:
    paths-ignore: [site/**, .github/workflows/site.yml]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every lane regardless of upstream changes
        type: boolean
        default: false
      php_version:
        description: Only this PHP version (versions.json key, e.g. 8.5)
        type: string
        default: ""
      os:
        description: Only this OS
        type: choice
        options: [all, alpine, trixie]
        default: all
      php_source:
        description: Build PHP from php-src tags (src, default) or official php images (upstream)
        type: choice
        options: [versions.json, upstream, src]
        default: versions.json

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      plans: ${{ steps.resolve.outputs.plans }}
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FULL_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
          FORCE: ${{ inputs.force }}
          ONLY_PHP: ${{ inputs.php_version }}
          ONLY_OS: ${{ inputs.os }}
          SOURCE: ${{ inputs.php_source }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$EVENT" in
            # published builds are permanent, so only image inputs force a full rebuild; other pushes get the upstream check
            push)
              if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" -q '.files[].filename') \
                || grep -qE '^([a-z-]+\.Dockerfile|docker-bake\.hcl|versions\.json|\.dockerignore|build/.*|rootfs/.*|scripts/tags\.sh)$' <<<"$files"; then
                args+=(--all)
              fi ;;
            pull_request) args+=(--all --no-patches); [ "$FULL_BUILD" = true ] || args+=(--php 8.5 --arch amd64) ;;
            workflow_dispatch) [ "$FORCE" != true ] || args+=(--all) ;;
          esac
          [ -z "$ONLY_PHP" ] || args+=(--php "$ONLY_PHP")
          [ -z "$ONLY_OS" ] || [ "$ONLY_OS" = all ] || args+=(--os "$ONLY_OS")
          [ -z "$SOURCE" ] || [ "$SOURCE" = versions.json ] || args+=(--source "$SOURCE")
          scripts/resolve-matrix.sh "${args[@]}"

  php:
    needs: resolve
    if: needs.resolve.outputs.versions != '[]'
    name: php ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/lanes.yml
    with:
      lanes: ${{ toJSON(fromJSON(needs.resolve.outputs.plans)[matrix.version].lanes) }}
      merges: ${{ toJSON(fromJSON(needs.resolve.outputs.plans)[matrix.version].merges) }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  site:
    needs: php
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      records: ${{ needs.php.result == 'success' || needs.php.result == 'failure' }}

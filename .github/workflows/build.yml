name: build

on:
  # every push runs here, not in site.yml, so the site deploys after any builds
  push:
    branches: [main]
  pull_request:
    paths-ignore: [site/**, .github/workflows/site.yml]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every lane regardless of upstream changes
        type: boolean
        default: false
      php_version:
        description: Only this PHP version (versions.json key, e.g. 8.5)
        type: string
        default: ""
      os:
        description: Only this OS
        type: choice
        options: [all, alpine, trixie]
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      plans: ${{ steps.resolve.outputs.plans }}
      versions: ${{ steps.resolve.outputs.versions }}
      libgrpc: ${{ steps.resolve.outputs.libgrpc }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FULL_BUILD: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
          FORCE: ${{ inputs.force }}
          ONLY_PHP: ${{ inputs.php_version }}
          ONLY_OS: ${{ inputs.os }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$EVENT" in
            # published builds are permanent, so only image inputs force a full rebuild; other pushes get the upstream check
            push)
              if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" -q '.files[].filename') \
                || grep -qE '^([a-z-]+\.Dockerfile|docker-bake\.hcl|versions\.json|\.dockerignore|build/.*|rootfs/.*|scripts/tags\.sh)$' <<<"$files"; then
                args+=(--all)
              fi ;;
            pull_request) args+=(--all --no-patches); [ "$FULL_BUILD" = true ] || args+=(--php 8.5 --arch amd64) ;;
            workflow_dispatch) [ "$FORCE" != true ] || args+=(--all) ;;
          esac
          [ -z "$ONLY_PHP" ] || args+=(--php "$ONLY_PHP")
          [ -z "$ONLY_OS" ] || [ "$ONLY_OS" = all ] || args+=(--os "$ONLY_OS")
          scripts/resolve-matrix.sh "${args[@]}"

  # one libgrpc per OS and arch, shared by every PHP version's lanes (ADR 0030); main only, like the products jobs
  libgrpc:
    needs: resolve
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.resolve.outputs.libgrpc != '[]' }}
    name: libgrpc ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.libgrpc) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Bake variables
        env:
          VARS: ${{ toJSON(matrix.vars) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$VARS" >> "$GITHUB_ENV"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/product-keys.sh --libgrpc | tee keys >> "$GITHUB_OUTPUT"
          scripts/product-plan.sh < keys | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        if: contains(format(' {0} ', steps.plan.outputs.restore), ' libgrpc ')
        with:
          path: products/libgrpc
          key: ${{ steps.plan.outputs.libgrpc }}
      - name: Build
        if: contains(format(' {0} ', steps.plan.outputs.build), ' libgrpc ')
        run: |
          docker buildx bake -f docker-bake.hcl -f versions.json --set product-libgrpc.output=type=local,dest=products/libgrpc product-libgrpc
          du -sh products/libgrpc
      - uses: actions/cache/save@v5
        if: contains(format(' {0} ', steps.plan.outputs.build), ' libgrpc ')
        with:
          path: products/libgrpc
          key: ${{ steps.plan.outputs.libgrpc }}

  php:
    needs: [resolve, libgrpc]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.versions != '[]' }}
    name: php ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.versions) }}
    permissions:
      contents: read
      actions: write
      packages: write
      id-token: write
    uses: ./.github/workflows/lanes.yml
    with:
      lanes: ${{ toJSON(fromJSON(needs.resolve.outputs.plans)[matrix.version].lanes) }}
      merges: ${{ toJSON(fromJSON(needs.resolve.outputs.plans)[matrix.version].merges) }}
      products: ${{ toJSON(fromJSON(needs.resolve.outputs.plans)[matrix.version].products) }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  site:
    needs: [resolve, php]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
      packages: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      # php runs on every non-PR run for the build products, so only planned merges mean records
      records: ${{ (needs.php.result == 'success' || needs.php.result == 'failure') && contains(needs.resolve.outputs.plans, '"variant"') }}

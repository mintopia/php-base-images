[global]
daemonize = no
; status and ping paths, written by the entrypoint under /run so the root can be read-only
include = /run/php-fpm/status.conf

[www]
user = ${PHP_FPM_USER}
group = ${PHP_FPM_GROUP}
listen = ${PHP_FPM_LISTEN}
clear_env = no
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}
; REMOTE_ADDR from nginx is the real client; %R is the nginx socket peer
access.format = "%{REMOTE_ADDR}e - %u %t \"%m %r%Q%q\" %s"
